[tool.black]
line-length = 88
target-version = ['py39']
skip-string-normalization = true
exclude = '''
/(
    \.git
  | \.__pycache__
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
force_grid_wrap = 0
include_trailing_comma = true
lines_after_imports = 2
lines_between_types = 1
multi_line_output = 3
skip = [".gitignore", ".dockerignore", ".md", ".json"]
use_parentheses = true
known_third_party = ["click", "codetiming", "dateutil", "jinja2", "jsonschema", "pytest", "setuptools"]

[tool.flake8]
ignore = "E203, E266, E501, W503, E231, F541"
max-line-length = 88
max-complexity = 18
select = "B,C,E,F,W,T4,B9"
